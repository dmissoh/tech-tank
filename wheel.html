<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tech Tank — Wheel</title>
<meta name="description" content="Interactive sunburst wheel of the architecture tooling landscape." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c0492a'/%3E%3Ctext x='16' y='23' font-size='17' font-weight='700' font-family='monospace' fill='%23fff' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="vendor/fonts.css" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="wheel.css" />
<script>document.documentElement.dataset.theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");</script>
</head>
<body>
<header class="site">
  <div class="wrap bar">
    <a class="logo" href="?"><span>[Tech&nbsp;Tank]</span><b>ARCH</b><i>beta</i></a>
    <nav class="wheel-nav">
      <a class="nav-link" href="/">▦ Index</a>
      <a class="nav-link" href="best-practices.html">◆ Best Practices</a>
      <span class="nav-active">◎ Wheel</span>
    </nav>
    <div class="src">
      <button class="file-btn" id="theme" title="Toggle theme" aria-label="Toggle theme">🌙</button>
    </div>
  </div>
</header>

<section class="wheel-controls">
  <div class="wrap">
    <input type="search" id="q" placeholder="Search tools or categories…" autocomplete="off" />
    <span class="count" id="count"></span>
  </div>
</section>

<main class="wheel-main">
  <div class="wheel-area">
    <button class="back-btn" id="backBtn" aria-label="Zoom out">← Back</button>
    <div id="sunburst" class="sunburst-container"></div>
    <div id="center-label" class="center-label">
      <span class="center-title">Tech Tank</span>
      <span class="center-sub">click a segment to explore</span>
    </div>
  </div>
  <aside class="detail-panel" id="detailPanel" hidden>
    <div class="detail-head">
      <button class="close" id="detailClose" aria-label="Close">✕</button>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </aside>
</main>

<div id="tooltip" class="tooltip" hidden></div>

<script src="vendor/d3-hierarchy.min.js" defer></script>
<script src="vendor/papaparse.min.js" defer></script>
<script src="wheel.js" defer></script>
</body>
</html>
